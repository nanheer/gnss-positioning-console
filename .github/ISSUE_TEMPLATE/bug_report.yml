name: Bug 报告
description: 提交一个问题，帮助我们定位缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索已有 Issue，避免重复。
        涉及安全问题请勿在此提交，请参考 SECURITY.md。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 发生了什么？期望的结果是什么？
      placeholder: 期望……实际……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量具体，便于我们复现
      placeholder: |
        1. 选择 SPP 模式
        2. 上传 base.o 与 base.nav
        3. 点击开始计算
        4. 出现报错……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错信息
      description: 后端控制台中「执行命令」与异常堆栈最有用；前端请附浏览器控制台输出
      render: shell
  - type: dropdown
    id: mode
    attributes:
      label: 解算模式
      options:
        - SPP
        - PPK
        - PPK + 基准站坐标
        - 与解算无关（界面 / 地图 / 其它）
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统、JDK、Node 版本、浏览器
      placeholder: Windows 11 / JDK 11 / Node 22 / Chrome 130
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、数据特征（采样率、时段）、是否可稳定复现等
